[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enggraph-backend"
version = "0.1.0"
description = "EngGraph backend: API, worker, connectors, graph repository, MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "neo4j>=5.20",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "alembic>=1.13",
    # MCP SDK 2.x: `MCPServer` (the 1.x `FastMCP` is gone) and `httpx2`, the client
    # the streamable HTTP tests drive the server with.
    "mcp>=2.3,<3",
    "httpx2>=2.16",
]

[tool.setuptools.packages.find]
include = ["enggraph*"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    # docker-compose.yml is parsed by tests/test_compose_contract.py
    "pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ helpers (shared ADO fixtures) are imported by test modules
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "neo4j: integration tests requiring a reachable Neo4j (ENGGRAPH_NEO4J_TEST_URI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["enggraph"]
known-local-folder = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
