# Alembic configuration for EngGraph Postgres schema.
# The DSN comes from the environment: ENGGRAPH_POSTGRES_DSN first, then the
# app's POSTGRES_DSN (see alembic/env.py). The URL below is a placeholder, not
# a credential, and is used only when neither variable is set.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+psycopg://enggraph:CHANGE_ME@localhost:5432/enggraph

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
